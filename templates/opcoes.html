{% extends 'base.html' %}

{% block title %}Diário de Bordo - Opções{% endblock %}

{% block content %}
<div class="header-profile" style="margin-bottom: 30px;">
    <div>
        <h2 style="font-family: 'Oswald', sans-serif; font-size: 2.2em;">Configurações do Jogo</h2>
        <small>Ajuste os dados da sua campanha e as preferências do sistema</small>
    </div>
    <div>
        <span class="material-symbols-outlined" style="font-size: 40px; color: var(--dourado);">settings</span>
    </div>
</div>

<div class="form-section" style="max-width: 600px; margin: 0 auto;">
    <form action="/salvar_opcoes" method="POST">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Nome do Motorista</label>
                <input type="text" name="nome" value="{{ jogador.nome }}" required>
            </div>
            
            <div class="form-group full-width">
                <label>Fase da Campanha</label>
                <select name="fase" required>
                    <option value="1" {% if jogador.fase == 1 %}selected{% endif %}>Fase 1 - Empregado (Motorista de Frota)</option>
                    <option value="2" {% if jogador.fase == 2 %}selected{% endif %}>Fase 2 - Agregado (Caminhão Próprio)</option>
                    <option value="3" {% if jogador.fase == 3 %}selected{% endif %}>Fase 3 - Autônomo (Caminhão + Reboque)</option>
                    <option value="4" {% if jogador.fase == 4 %}selected{% endif %}>Fase 4 - Empresário (Transportadora Própria)</option>
                </select>
                <small style="color: var(--texto-mudo); font-size: 0.85em; margin-top: 5px; display: block;">Atenção: Mudar a fase altera as taxas de comissão e quem paga os custos de viagem.</small>
            </div>
            
            <div class="form-group full-width">
                <label>Moeda do Jogo</label>
                <select name="moeda" required>
                    <option value="$" {% if jogador.moeda == '$' %}selected{% endif %}>Dólar ($)</option>
                    <option value="€" {% if jogador.moeda == '€' %}selected{% endif %}>Euro (€)</option>
                    <option value="R$" {% if jogador.moeda == 'R$' %}selected{% endif %}>Real (R$)</option>
                    <option value="£" {% if jogador.moeda == '£' %}selected{% endif %}>Libra (£)</option>
                </select>
            </div>

            <div class="form-group full-width" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--borda);">
                <div class="custom-checkbox-container">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="confirmar_voltar_dia" {% if jogador.confirmar_voltar_dia %}checked{% endif %}>
                        <span class="checkmark"></span> Perguntar confirmação antes de "Voltar no Tempo" (Recuar 1 dia)
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 8px; font-family: 'Oswald', sans-serif;">
            <span class="material-symbols-outlined">save</span> Salvar Alterações
        </button>
    </form>
</div>
{% endblock %}
